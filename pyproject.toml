[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testgenrl"
version = "0.1.0"
description = "MDP-guided reinforcement learning for cost-aware LLM-based test generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
research = [
  "coverage>=7",
  "google-generativeai>=0.8",
  "hypothesis>=6",
  "jsonlines>=4",
  "jinja2>=3",
  "numpy>=1.26",
  "openai>=1.40",
  "pandas>=2.2",
  "pytest>=8",
  "PyYAML>=6",
  "requests>=2.31",
  "rich>=13",
  "scipy>=1.12",
  "torch>=2",
  "tqdm>=4",
]

[project.scripts]
sagetransval = "sagetransval.cli:main"
testgenrl = "testgenrl.cli:main"

[tool.setuptools.packages.find]
include = ["sagetransval*", "testgenrl*"]
